<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0E4F4A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>Olmera - Care, quietly connected.</title>
    <meta name="description" content="Olmera is a modern healthcare platform connecting patients, specialists, and diagnostics with quiet clarity and precision." />
    <meta property="og:title" content="Olmera - Care, quietly connected." />
    <meta property="og:description" content="Connect with trusted specialists, appointments, and medical records quietly and securely." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Olmera" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Olmera - Care, quietly connected." />
    <meta name="twitter:description" content="Connect with trusted specialists, appointments, and medical records quietly and securely." />
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('olmera_theme');
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = savedTheme === 'dark' || (!savedTheme && systemDark);

          document.documentElement.classList.toggle('dark', isDark);

          var applyBodyTheme = function() {
            if (document.body) document.body.classList.toggle('dark', isDark);
          };

          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', applyBodyTheme);
          } else {
            applyBodyTheme();
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
